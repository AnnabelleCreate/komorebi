# Backup only. Komorebi.xcodeproj is included and should open as-is in Xcode 16 or later.
# If it doesn't open on your Xcode version, run:  brew install xcodegen && xcodegen
# in this folder to regenerate Komorebi.xcodeproj from this file.
name: Komorebi
options:
  bundleIdPrefix: edu.cmu.aixd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Komorebi:
    type: application
    platform: iOS
    sources:
      - path: Komorebi
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cmu.aixd.komorebi
        INFOPLIST_FILE: Config/Komorebi-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Komorebi
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Komorebi listens for one slow breath so you can blow your lantern down the river. Nothing is recorded or saved."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        CODE_SIGN_ENTITLEMENTS: Config/Komorebi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KomorebiWidgets
        embed: true
  KomorebiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KomorebiWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cmu.aixd.komorebi.widgets
        INFOPLIST_FILE: Config/KomorebiWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Komorebi
        CODE_SIGN_ENTITLEMENTS: Config/KomorebiWidgets.entitlements
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        TARGETED_DEVICE_FAMILY: "1"
